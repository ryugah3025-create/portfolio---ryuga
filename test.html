<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Hand-drawn Style 3D Character</title>
  <style>
    body {
      margin: 0;
      background-color: #fff;
      overflow: hidden;
    }

    #instruction {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="instruction">原の作品</div>
  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // シーン設定
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ライト（イラスト風なのでシンプルに）
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    // --- 外形線（アウトライン）用関数 ---
    function createOutlineMesh(geometry, thickness = 0.05) {
      const material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.scale.multiplyScalar(1 + thickness);
      return mesh;
    }

    // --- 顔テクスチャ ---
    const faceCanvas = document.createElement('canvas');
    faceCanvas.width = 512; faceCanvas.height = 512;
    const ctx = faceCanvas.getContext('2d');

    function drawFace(isSmiling = false) {
      ctx.clearRect(0, 0, 512, 512);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';

      // 眉毛
      ctx.fillStyle = '#000';
      ctx.fillRect(160, 120, 50, 15);
      ctx.fillRect(300, 120, 50, 15);

      // 目
      ctx.beginPath();
      ctx.arc(185, 170, 6, 0, Math.PI * 2);
      ctx.arc(325, 170, 6, 0, Math.PI * 2);
      ctx.fill();

      // 鼻（特徴的なあの形）
      ctx.beginPath();
      ctx.moveTo(220, 230);
      ctx.quadraticCurveTo(256, 200, 292, 230); // 上のカーブ
      ctx.moveTo(220, 230);
      ctx.quadraticCurveTo(230, 260, 256, 260); // 左下
      ctx.quadraticCurveTo(282, 260, 292, 230); // 右下
      ctx.stroke();

      // 口
      ctx.beginPath();
      if (isSmiling) {
        ctx.arc(256, 280, 60, 0.1 * Math.PI, 0.9 * Math.PI);
      } else {
        ctx.moveTo(210, 320);
        ctx.quadraticCurveTo(256, 305, 302, 320);
        ctx.moveTo(230, 335);
        ctx.quadraticCurveTo(256, 330, 282, 335);
      }
      ctx.stroke();
      faceTexture.needsUpdate = true;
    }

    const faceTexture = new THREE.CanvasTexture(faceCanvas);
    drawFace(false);

    // --- キャラクターの構築 ---
    const character = new THREE.Group();
    scene.add(character);

    // 顔（少し長方形の丸まった形状）
    const headGeo = new THREE.BoxGeometry(2.5, 3.2, 2.2);
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const faceMat = new THREE.MeshBasicMaterial({ map: faceTexture });
    // 前面だけ顔テクスチャ
    const headMats = [whiteMat, whiteMat, whiteMat, whiteMat, faceMat, whiteMat];
    const head = new THREE.Mesh(headGeo, headMats);
    head.position.y = 3.5;
    character.add(head);
    head.add(createOutlineMesh(headGeo, 0.03));

    // 耳
    const earGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const earL = new THREE.Mesh(earGeo, whiteMat);
    earL.position.set(-1.3, 3.5, 0);
    earL.scale.set(0.5, 1, 1);
    head.add(earL);
    earL.add(createOutlineMesh(earGeo, 0.1));
    const earR = earL.clone();
    earR.position.x = 1.3;
    head.add(earR);
    earR.add(createOutlineMesh(earGeo, 0.1));

    // 髪の毛（黒いお椀型）
    const hairGeo = new THREE.CapsuleGeometry(1.3, 0.5, 4, 16);
    const hairMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const hair = new THREE.Mesh(hairGeo, hairMat);
    hair.position.y = 1.2;
    head.add(hair);

    // 体（Tシャツ）
    const bodyGeo = new THREE.CylinderGeometry(1.2, 1.3, 2.2, 32);
    const body = new THREE.Mesh(bodyGeo, whiteMat);
    body.position.y = 1.0;
    character.add(body);
    body.add(createOutlineMesh(bodyGeo, 0.03));

    // ズボン（黒）
    const pantsGeo = new THREE.CapsuleGeometry(0.6, 1.2, 4, 16);
    const pantsMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const legL = new THREE.Mesh(pantsGeo, pantsMat);
    legL.position.set(-0.5, -0.5, 0);
    character.add(legL);
    const legR = legL.clone();
    legR.position.x = 0.5;
    character.add(legR);

    // --- クリックイベント ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isSmiling = false;

    window.addEventListener('mousedown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(character.children, true);
      if (intersects.length > 0) {
        isSmiling = !isSmiling;
        drawFace(isSmiling);
        // ぴょこっと動く
        head.position.y += 0.2;
        setTimeout(() => head.position.y -= 0.2, 100);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
  </script>
</body>

</html>
